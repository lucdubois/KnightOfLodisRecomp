# Per-map settings (src/kol_map_settings.h). One line a setting:
#   <key> <map> [<map> ...]
# Built into the game; a map_settings.cfg beside enhancements.cfg (the
# Thor's files/) or KOL_MAP_SETTINGS=<path> (desktop) is read instead.
# Maps: 16 marsh, 39 throne hall, 51 cave with blue fire pots, 55 castle,
# 58 ship at night, 62/63 camp, 65 moonlit room (66 the same with its door shut and torches lit), 67/68 dungeon cell
# (68 flooded), 71 boat-builder's shed (70 the same by day, its window shut), 89 fortune teller's town, 98 town
# under fire arrows, 99 burning town at night, 100 smoke scene, 101 the
# intro's castle room, 102 the opening's narration map, 83 the stairwell room
# (green torchlight), 90 / 117 a small boat at a pier, sail furled / set, 73 a
# flooded cavern with a ruined arch, 75 a cave roofed past its grid, stalactites and
# vines hanging from the roof's edge.

# No sun: the darkness and lamps of kDarkMaps / kMapLamps light it instead
# (58 only while kNightShip is on).
indoor 39 71 70 51 55 56 58 59 60 62 63 64 65 66 67 68 75 77 78 79 83 91 99 101 76 52 81 82 61 118

# The right stick does not move the camera there. (None now: 89, 71 and 70 were
# here until 2026-11-16, small_look since.)
# no_look

# The right stick moves the camera a little only there (0.3 of its range), in a battle
# too. Every story event has the small range anyway (kol_perspective); these maps'
# pictures do not hold up under a full lean.
small_look 89 71 70

# The water effect without its shore foam (16: puddles in the grass).
no_foam 16

# The wet look in the rain without puddles (16 has water of its own).
no_puddles 16

# Ambient occlusion from the map's 3D model (its walls and things).
model_ao 71 70 65 66 77 78 83 91 90 117 73 75 59 60 79 61

# The dark map's wet stone floor (bump map and slime glints).
wet_floor 51

# Every BG1 shape is a prop (102's rocks and trees past the art; 57: Shaher,
# the final boss drawn on BG1, standing at the board's corner).
bg1_props 102 57

# A cone window's shafts start across its opening (71's shutter window).
cone_window_tip 71 70

# Lamps lit and shadowed by the ship's model (58 at night).
ship_light 58

# BG1 flame blocks stood up as self-lit cards; smoke as see-through cards.
flames 98 99
smoke 100

# Lamps light the model's walls by their own normals, fading in from the
# side turned away (83's round newel and drum, not split in two halves;
# 91's colonnade and canopy columns).
round_light 83 91 60 79

# Its polished stone floor mirrors what stands over it (kPolishedCells:
# 91's marble, not its pool or carpet).
polished_floor 91

# Its own sun holds, whatever turn the battle before it ended on (59's window
# light, a scene with no turns of its own).
fixed_sun 59 75
fixed_sun 61 75

# Its window's straight beams cast units' shadows, as a cone's do; they lose the
# game's blob (KOL_NO_WINDOW_SHADOWS=1 off).
window_unit_shadows 59 61

# Our rain goes up, slower, and never lands; no wet look and no drips (57: the
# game's own rain rises there).
rain_rises 57

# A BG1 prop's blue flame (57: Shaher's, below his chest) lit by itself, not
# darkened by the light, the occlusion or the prop's foot shade, and lighting
# the floor and the units round it in blue.
glow_flame 57

# The circle the game draws on BG2 for a spell (57: Shaher's summoning circle)
# laid on the floor, so it stays there when the camera moves, and glowing in
# its own colour over the light, with its light on the units.
magic_circle 57

# Props with no foot shade: their lowest rows not darkened and no dark spot
# on the ground round their foot (57: Shaher stands on the board as a prop;
# the user, 2026-11-12: "remove the prop AO blob from him").
no_prop_foot 57 56

# A BG1 shape (bg1_props) stands on one foot, the one nearest its middle
# column, not a foot per trunk: one creature (57: Shaher; his left side,
# over cell 0,1 in some frames, sat a step nearer and came apart from him
# when the camera leaned; the user, 2026-11-12: "his left side is splitting
# and moving camera to the right").
one_foot 57
