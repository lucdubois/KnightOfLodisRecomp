# Fast Walking / Quick Enemy Turns (src/kol_fast_actions.cpp, README "Fast
# walking and quick enemy turns"). The battle's phase task (0x0202A5B0) is
# stepped once a frame by 0x0806B640, which switches on its mode byte to one
# of eight handlers (the table at 0x0806B75C): case 4 0x0806AA44 is the
# enemy AI (it decides over ~100 frames, about a tenth of a frame each),
# case 6 0x08065B20 the action executor (a unit walking: phase byte
# 0x0202A82E = 0x15, 2 world units a frame). Each case is `adds r0, r2, #0;
# bl handler; b exit`; these are the resume entries after the two bl's. The
# hook declines, or (in those phases) sends R15 back to the case's own
# `adds` (0x0806B79C, 0x0806B7AC) with r2 = the task, so the game itself
# calls the handler again in the same frame, the guest clock held.
[[mod_function_hook]]
addr = 0x0806B7A2
mode = "thumb"

[[mod_function_hook]]
addr = 0x0806B7B2
mode = "thumb"

# 0x080286EC loads a room's palette set (rows 0-3, then 12 on) into the
# palette buffer 0x02002400, the set picked by its callers from the map header
# by the time of day (0x020021BC). src/kol_actions.cpp, on map 77 outside the
# Original preset, swaps a later set (header +0x24 / +0x28, the evening's
# purple floor after the flashback, states/thor/0157) for the day's (+0x20)
# and makes the call again. Declines every other call. KOL_NO_DAY_PALETTE=1.
[[mod_function_hook]]
addr = 0x080286EC
mode = "thumb"

