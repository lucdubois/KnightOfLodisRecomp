# A switch the finder's auto_jt did not size: `cmp r3, #0x80; bls; ldr r0,
# =0x080735A0; add r0, r8 (r3*4); ldr r0, [r0]; mov pc, r0` at 0x08073582..96.
# The table address comes from the literal pool, not from pc. 129 absolute
# Thumb targets (index 0..0x80), all inside this function. Two of its cases
# (0x0807384E, 0x08073852) and 0x08073864, which those cases branch to, were
# in the Mac self-heal cache (2026-10-06).
[[jump_table]]
addr         = 0x080735A0
stride       = 4
count        = 129
format       = "abs32"
entries_mode = "thumb"
name         = "switch_08073596"
note         = "mov pc switch, index bounded by cmp r3, #0x80"

