# ── Sprite visibility window (the extended view's side/top margins) ──
#
# 0x08076810 is the game's generic sprite emitter: everything drawn as an OBJ
# goes through it, and it rejects anything whose screen position falls outside
# the GBA's own 240x160. The four immediates below ARE that window:
#
#   08076872  ldrh  r0,[r5,#0x1C]   ; screen X
#   08076874  adds  r0,#0x20        ; + left slack          <-- override
#   08076876  lsls  r0,r0,#16       ; truncate to u16
#   08076878  movs  r1,#0x98        ; width limit / 2       <-- override
#   0807687A  lsls  r1,r1,#17       ; 0x98<<17 == 304<<16
#   0807687C  cmp   r0,r1
#   0807687E  bhi   0x080768B2      ; reject
#   08076880  movs  r0,#0x1E        ; STRUCT OFFSET - never override
#   08076882  ldrsh r1,[r5,r0]      ; screen Y
#   08076884  movs  r0,#0x10        ; top slack             <-- override
#   08076886  rsbs  r0,r0,#0
#   08076888  cmp   r1,r0
#   0807688A  blt   0x080768B2      ; reject
#   0807688C  cmp   r1,#0xC0        ; bottom limit          <-- override
#   0807688E  bgt   0x080768B2      ; reject
#
# So the stock accept window is X in [-32, 272], Y in [-16, 192]. That -32 is
# exactly the boundary measured in OAM when units pop in at the edge of the
# extended view (README "Units do not appear in the margins"): the sprites are
# never emitted, so no rendering policy can reveal them.
#
# Routing these four through the immediate hook lets the game widen its OWN
# cull to the surface it is actually being rendered at, so animation, facing,
# palette and isometric depth ordering all still come from the guest. The
# callback returns the stock value whenever the view is the authentic 240x160,
# which keeps the faithful render byte-identical.
#
# 0x08076880 and 0x08076890 are immediates in the same basic block and are NOT
# listed: the first is a struct offset used as an ldrsh index, the second is a
# plain zero.

[[thumb_alu_immediate_override]]
addr = 0x08076874
note = "OBJ cull: left slack, stock 0x20 (32px). Widened to 32 + extra_x."

[[thumb_alu_immediate_override]]
addr = 0x08076878
note = "OBJ cull: horizontal limit, stock 0x98 (<<17 == 304). Widened to 152 + extra_x."

[[thumb_alu_immediate_override]]
addr = 0x08076884
note = "OBJ cull: top slack, stock 0x10 (negated to -16). Widened to 16 + extra_y."

[[thumb_alu_immediate_override]]
addr = 0x0807688C
note = "OBJ cull: bottom limit, stock 0xC0 (192). Widened to 192 + extra_y."

