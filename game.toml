# ── 0x0815BC80-0815BDB0 handler-table cluster ─────────────────────────
# Reviewed 2026-09-17 from a clean cold-cache 2000-frame boot, by hand
# disassembling the region with gbarecomp's own ARM/Thumb decoder (a
# throwaway tool linked against libgbarecomp_armv4t.a) instead of
# guessing from the miss log alone. NOT a jump table, despite the
# runtime's own "jump_table_candidate" flag on some of these PCs (that
# heuristic is just "misses are close together" and false-positives on
# this shape). What's actually here: a run of tiny trampoline functions,
# each `mov r12,lr / bl <shared helper> / store result / bx r12` -
# consistent with MP2K/Sappy's per-parameter track/channel event
# handlers. Every one of these functions has exactly one internal `bl`,
# so it has exactly one interior instruction (the return point from
# that bl) that only gets asked for when an IRQ happens to land there -
# structurally the same thing bios/gba_bios.toml's [[resume_range]]
# entries exist for, not a discovery gap.
#
# The ten entries below are the trampoline functions themselves (the
# static walk never found a caller for them - they're reached through
# an as-yet-unidentified function-pointer table, the actual "jump
# table" this cluster's data plausibly belongs to). The resume_range
# after them covers every interior return-point PC inside this whole
# region, present and future - exact-address whack-a-mole isn't
# reliable here since which interior PC gets hit depends on self-heal
# cache warmth shifting instruction timing run to run (observed:
# 0x0815BC16/18/22 appeared as misses in an earlier probe of this same
# cluster and did not reappear in the run this note is based on).

[[extra_func]]
addr = 0x0815BC04
mode = "thumb"
note = "self-heal miss, cold-cache 2000-frame boot; trampoline fn entry, caller not yet found"

