# The sound driver produced a NEW interior PC on every pass -- 0x030061C8,
# then 0x03005B24, then 0x03005AC0, each "near gf_tfunc_03005A94" and each
# appearing only once the previous was native. They are asynchronous IRQ
# returns landing inside the driver, which is exactly the case the schema
# says to answer with a bounded resume_range rather than by listing one
# reactive [[extra_func]] per observed interrupt timing. static_resume_all
# already covers interior PCs of EMITTED bodies; these land past the end of a
# function the finder bounded short, so they were not covered.
[[resume_range]]
start = 0x03005A94
end   = 0x03006A94
mode  = "thumb"
note  = "M4A-shaped IWRAM sound driver: IRQ returns at many interior instructions. 0x1000 is the schema cap."

