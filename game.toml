# 0x08021A40(ctx, params) is the world map event scripts' random roll (op
# 0x8F): when rand() % 101 > params[1] the script jumps by params[2]. Script
# group 2 (ctx byte 0) is the random battles, a 20% roll each. With the debug
# option "No random battles" on, src/kol_actions.cpp takes that jump for group
# 2 as the game does when the roll fails; it declines every other call.
[[mod_function_hook]]
addr = 0x08021A40
mode = "thumb"

# 0x08118B4C(place, n) gives a world-map battle its map number (a table of
# 12 a place at 0x08768BCC); its only caller is 0x0801FA78, the script op
# that starts a battle, which Training uses too. With Debug > Battle Map set,
# src/kol_actions.cpp answers that number (1..119) and returns; otherwise it
# declines and the game picks as always.
[[mod_function_hook]]
addr = 0x08118B4C
mode = "thumb"

# 0x08021B68 is the map header parser every map load goes through (it reads
# the map number at 0x02029D40): the battle's loading (0x08047ABA ..
# 0x080488F0) and the story scene loader 0x0811C77C call it.
# src/kol_actions.cpp counts the loads and declines: the wet look starts
# over with each map, even the same one reopened.
[[mod_function_hook]]
addr = 0x08021B68
mode = "thumb"

# 0x0811C77C loads a story scene's map: it calls the header parser
# 0x08021B68 (which reads the map number at 0x02029D40), then the BG setup
# 0x0804B1FC / 0x0804B150. Called by BL from 0x08120B0A and 0x081275D0 (New
# Game's opening scene runs through it); it starts push {r4, r5, lr} after a
# literal pool, and was missing from the static build (nothing from
# 0x0811C77C to 0x0811CBA0 had a symbol). With Debug > Battle Map set,
# src/kol_actions.cpp writes the chosen map number before it runs and
# declines, so the scene loads that map the game's own way.
[[extra_func]]
addr = 0x0811C77C
mode = "thumb"
