# game.toml — per-binary recompile config for
# Tactics Ogre: The Knight of Lodis (USA), GBA game code ATOE.
#
# See gbarecomp/docs/TOML_SCHEMA.md for the schema reference.
# This file is HAND-MAINTAINED. gba_recompile never writes to it —
# miss-log-derived proposals land in recomp_seed_proposals.toml and
# are merged in here manually after human review (see CLAUDE.md).

[program]
name         = "Tactics Ogre: The Knight of Lodis"
id           = "totkol"
load_address = 0x08000000
size         = 0x00800000   # 8 MiB (8,388,608 bytes)
entry_pc     = 0x080000C0   # standard GBA post-header entry

# Every aligned instruction in every emitted body gets a dispatch/resume entry.
# Reason (2026-09-18): a save state records the guest PC, and on ANDROID an
# interior PC that is not a declared resume point cannot be entered natively —
# self-heal recompilation is off there by design (no runtime toolchain), so the
# load falls into the interpreter bridge. When that PC is inside an idle event
# pump the bridge deadlocks: the loop only exits on input, and input cannot
# arrive because the host loop that delivers it is blocked inside the bridge.
# It burns 200M instructions and aborts. Saving on any static screen (the
# character info page is the reproducer) landed on 0x0801A4F8, the backward
# branch of the pump at 0x0801A4EC, and produced exactly that.
# A [[resume_range]] over that one function would fix that one screen; this
# makes every save state resumable instead, which is what the schema
# recommends for strict end-to-end AOT builds.
static_resume_all = true

[identity]
sha1 = "85a46320a31f16f5c6dda27fc094edd078dbe43d"
md5  = "5d4f385e4e1cfa4a057d0ac828993906"

# ── Coverage gap found chasing the call-return-stack leak (2026-09-17) ──
# 0x0815938A is a genuine, direct `bl 0x0815938a` call target (confirmed
# by disassembly of the call site at 0x08010386), but it sits in the
# MIDDLE of a larger enclosing function's byte range (a backward-branch
# loop ends just a few bytes before it) - the discovery walk never
# treats mid-function bytes as a fresh entry on its own, so this call
# ALWAYS missed and went through the self-heal interpreter bridge on
# every single invocation. That bridge's handling of a real IRQ firing
# mid-interpretation is implicated (not fully root-caused) in a call-
# return-stack leak that survived an earlier upstream gbarecomp fix -
# see README.md/CLAUDE.md. Seeding this entry makes the call a plain,
# statically-dispatched C++ call like any other, removing it from the
# self-heal path entirely regardless of whether the deeper bridge/IRQ
# interaction is ever fully fixed.
[[extra_func]]
addr = 0x0815938A
mode = "thumb"
note = "self-heal miss, chasing the call-return-stack leak; genuine bl target mid-function, never discovered as its own entry"

# ── Function entries ────────────────────────────────────────────────
# Reviewed 2026-09-17 from recomp_master_misses_ATOE.toml.frag, produced
# by a cold-cache 600-frame boot (--no-window --frames 600) after the
# first automated discovery pass (37,477 functions, 0 manual seeds).
# All nine are "near" an already-discovered function per the self-heal
# log, i.e. entry points inside/adjacent to a function the initial walk
# found but didn't fully bound (interior BL/branch targets it didn't
# follow as separate entries). Each is a real ROM code address the
# static walk simply didn't reach on its own.
#
# NOT merged from that same run's proposal, on purpose:
#   0x03001110 (arm), 0x03007E5C (thumb) — IWRAM (RAM) addresses, outside
#     this binary's ROM range (load_address/size above). Code copied into
#     RAM at runtime belongs to the self-heal RAM-dispatch tier
#     (g_runtime_ram_dispatch_hook in the shared runtime), never a
#     game.toml extra_func — there is no fixed ROM byte range to decode.
#
# 0x08000000 (arm), bridged x1 — investigated 2026-09-17, corrected below.
# This was WRONGLY described in an earlier revision of this file as
# "inside the header (title/checksum bytes)". It isn't. The real GBA
# header layout is: bytes 0x00-0x03 = the entry branch instruction
# (code), 0x04-0x9F = the Nintendo logo bitmap, 0xA0-0xAB = title,
# 0xAC-0xAF = game code, 0xB0-0xB1 = maker, 0xBD = checksum (data).
# Disassembling 0x08000000 directly (gbarecomp's own ARM decoder, same
# throwaway tool used for the 0x0815B8xx cluster below) shows a genuine,
# valid `b 0x080000C0` — the actual GBA hardware boot entry point, which
# just branches past the logo/title/checksum to the code at entry_pc
# above. Real hardware's BIOS jumps to 0x08000000, not 0x080000C0; our
# entry_pc skips that one redundant hop for the discovery walk, so
# nothing in the reachable graph pointed back at it — except the
# recompiled BIOS's own boot sequence, once, taking the hardware-accurate
# path. Not a false-positive risk: this is independently verified as a
# real instruction, not a guess from an address that merely looks
# code-shaped.

[[extra_func]]
addr = 0x08000000
mode = "arm"
name = "cart_header_entry_branch"
note = "Real hardware GBA boot entry: `b 0x080000C0`, skips the logo/title/checksum. Hit once by the recompiled BIOS's own boot sequence; see comment above."


# Superseded 2026-09-17: 0x080005DC, 0x080005EA, 0x080005F4, 0x0800072A,
# 0x08000732, 0x08000954, 0x0800135E, 0x0815B878 and 0x0815B880 were
# originally added here as individual [[extra_func]] entries. Direct
# disassembly (same method as the handler-table cluster below) showed
# every one of them is the interior return-point of an internal `bl`
# inside one long, already-discovered function, not a separate function
# body — the same resume-point shape, just not yet understood as such
# at the time. A fresh cold-cache run then surfaced a NEW, previously
# unseen sibling point (0x080005D8) in the exact same function,
# confirming individual points are the wrong tool here: which interior
# PC gets hit shifts with self-heal cache warmth / execution timing.
# Replaced with resume_range entries over each enclosing function's
# real extent (bounded by disassembling forward to its actual `bx`/pop
# return), which covers every interior point in each function, seen or
# not, in one entry.

