mode = "thumb"


# A unit's profile from the second screen's army list, on the world map: the
# status window Organize opens on a unit, opened on the tapped unit directly.
# 0x08128D9C is the world map's roaming task (state 4 reads the pad); for a
# tap there, src/kol_actions.cpp does what its R branch (0x081292E8) does:
# starts the command menu's task and suspends itself, two tail calls.
# 0x08128220 is that command menu (state 1 reads the pad); the hook queues
# Organize (11) behind the fade-out (15) as its A on Organize does. The
# status task and roster task hooks above then open the window on the unit,
# and B there closes the whole menu (the battle window's own branch).
# KOL_NO_WORLD_PROFILE=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x08128D9C
mode = "thumb"

[[mod_function_hook]]
addr = 0x08128220
mode = "thumb"

