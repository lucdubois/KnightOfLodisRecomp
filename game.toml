# Fast Loading (src/kol_fast_load.cpp, Options > Advanced; off by default).
# Coming back to the battle map from View List the game rebuilds the screen
# over ~54 frames inside its VBlank handler. Two of its steps have exact
# native equivalents: 0x08004990, the A7 asset decoder (transcribed and
# verified in src/kol_a7.cpp), and 0x08002F92, a byte-at-a-time memset
# (strb; r0++; r1--; while r1 > 0). With the setting on the hooks do the work
# natively and return as the routine would; off, they decline.
[[mod_function_hook]]
addr = 0x08004990
mode = "thumb"

[[mod_function_hook]]
addr = 0x08002F92
