# 0x0814506C(0xB0), dropped: the window's B already made one.
[[mod_function_hook]]
addr = 0x08127F7C
mode = "thumb"

[[mod_function_hook]]
addr = 0x0814506C
mode = "thumb"

# 0x0803AD4C is the status window's key reader (the first new key in its
# priority list). For Item, Spell or Class from the second screen's bar, the
# hook answers R to the Organize grid's read and then A to its R menu's,
# the menu's cursor on the item (src/kol_actions.cpp). Declines otherwise.
[[mod_function_hook]]
addr = 0x0803AD4C
mode = "thumb"

# 0x080414C0 draws the Organize grid's R menu screen (its icons, label and
