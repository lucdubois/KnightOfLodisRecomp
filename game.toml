[[mod_function_hook]]
addr = 0x08060E54
mode = "thumb"


# ── ROM -> IWRAM code copies (2026-09-22) ───────────────────────────
# These three blocks CORRECT the claim made in the extra_func comment near
# the top of this file, that IWRAM addresses like 0x03001110 belong to the
# self-heal RAM-dispatch tier because "there is no fixed ROM byte range to
# decode". There is. All six PCs the interpreter bridges every session are
# byte-for-byte copies of ROM, and [[code_copy]] is the schema's mechanism
# for exactly this: it keeps the RUNTIME pc while decoding the SOURCE bytes,
# so PC-relative loads and the literal pool resolve correctly by construction.
#
# Why this matters more than it looks: the self-heal recompile tier CANNOT
# run on Android (the platform blocks dlopen of an app-written .so), so those
# PCs stayed interpreted forever there. Measured 2026-09-22 at a battle state:
# the interpreter is ~3.5 ms of every frame at EVERY view size -- 53% of the
# frame at 240x160 and 39% at 480x270 -- while the Thor sits at 99% of one
# core. It is also why fast-forward does nothing: it needs N guest frames per
# present and there is no spare CPU to run them.
#
# Evidence for each range: GBARECOMP_IWRAM_DUMP taken from four independent
# in-play states (AF_world_map, AS_scroll_flash, AT_status_sheet,
# S_move_highlight) plus a 400-frame cold boot, each compared byte-for-byte
# against the ROM source below.

[[code_copy]]
runtime_start = 0x03001110
source_start  = 0x080000FC
size          = 0x00000160
name          = "iwram_arm_helpers"
note          = "ARM. Holds the hottest bridged PC by far: 0x03001110, 126434 calls per 600 frames (~211/frame), plus 0x030011D8. Byte-identical to ROM in all five dumps INCLUDING cold boot, so it is resident from startup."

# Found by the SECOND pass: once 0x03001110 was native, the bridge reported
# 0x03001270 x125834 -- the same call count, one byte past the end of the block
# above. The two are adjacent in IWRAM but come from ROM addresses 6 MiB apart,
# so they are separate copies and the first block's size could not simply grow.
[[code_copy]]
runtime_start = 0x03001270
source_start  = 0x0806E208
size          = 0x00000060
name          = "iwram_thumb_1270"
note          = "THUMB. Byte-identical to ROM in all five dumps including cold boot. The 48-byte signature occurs exactly once in the 8 MiB ROM."

[[code_copy]]
runtime_start = 0x030035D8
source_start  = 0x0815B8BC
size          = 0x00000380
name          = "iwram_thumb_mid"
note          = "THUMB. Covers bridged PC 0x030035D8 (600 calls per 600 frames, once a frame). Byte-identical to ROM in all five dumps including cold boot."

[[code_copy]]
runtime_start = 0x03005240
source_start  = 0x087D4D58
size          = 0x00002818
name          = "iwram_sound_driver"
note          = "THUMB. Covers bridged PCs 0x03005758 (5400 calls per 600 frames, ~9/frame -- M4A mixer shape), 0x03006328 and 0x03006D48. NOT resident at cold boot: the region is all zeros at 400 frames and is copied in once audio starts, so this one is loaded later rather than at startup. Single fixed source -- the 64-byte signature at 0x03005758 occurs EXACTLY ONCE in the 8 MiB ROM -- and all four in-play dumps agree on it. Leading bytes of the declared range are padding that is zero in both ROM and IWRAM."

# The six runtime entry points inside those copies. [[code_copy]] declares the
# byte mapping but creates no functions on its own (TOML_SCHEMA.md), and
# nothing in ROM branches to these addresses directly -- the callers reach them
# through function pointers -- so the discovery walk cannot find them. Each is
# a PC the interpreter bridge actually reported, with its call count from a
# 600-frame battle run; source_addr gives the finder the immutable ROM backing.

[[extra_func]]
addr        = 0x03001110
source_addr = 0x080000FC
mode        = "arm"
name        = "iwram_helper_1110"
note        = "bridged x126434 per 600 frames -- the single hottest interpreted PC in the game"

[[extra_func]]
addr        = 0x030011D8
source_addr = 0x080001C4
mode        = "arm"
name        = "iwram_helper_11d8"
note        = "bridged x600 per 600 frames"

[[extra_func]]
addr        = 0x030035D8
source_addr = 0x0815B8BC
mode        = "thumb"
name        = "iwram_thumb_35d8"
note        = "bridged x600 per 600 frames"

[[extra_func]]
addr        = 0x03005758
source_addr = 0x087D5270
mode        = "thumb"
name        = "iwram_sound_5758"
note        = "bridged x5400 per 600 frames (~9/frame)"

[[extra_func]]
addr        = 0x03006328
source_addr = 0x087D5E40
mode        = "thumb"
name        = "iwram_sound_6328"
note        = "bridged x600 per 600 frames"

[[extra_func]]
