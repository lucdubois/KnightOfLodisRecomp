# ── Next unit, from a button (2026-09-24) ──────────────────────────
# 0x080745A4 is the battle cursor's hold-L state machine, called once a frame
# during player control. src/kol_actions.cpp may take ONE call of it, when the
# second screen's "Next unit" button is pending and the machine is in its
# ordinary state, and tail-call the game's own selection 0x08074338(0) in its
# place with the index it keeps. Declines every other call. KOL_NO_ACTIONS=1.
[[mod_function_hook]]
addr = 0x080745A4
mode = "thumb"

# 0x0803A0D0 is the status window's task (the battle map's window and the
# army roster's alike). src/kol_actions.cpp only records the unit the window
# shows, for the second screen, and declines every call. KOL_NO_ACTIONS=1.
[[mod_function_hook]]
addr = 0x0803A0D0
mode = "thumb"

# 0x08034498 is the roster task (in the menu task table above). It draws the
# status window's contents, in the army roster and on the battle map alike;
# its state byte (r1) is 3 while the window is up. src/kol_actions.cpp, with
# a "Next unit"/"Previous unit" tap pending and the window idle (control
# block sub-state 1), points the window at the neighbouring unit and sets
# that byte to 0, then declines, so the task's own init draws the new unit.
# In battle it then takes ONE later idle call and tail-calls 0x0803A964, the
# game's own refresh of the window's sprite, in its place. Declines every
# other call. KOL_NO_STATUS_SWITCH=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x08034498
mode = "thumb"

# The game's OPTION window (R on an empty tile > System > Option in a battle,
# System > Option on the world map): 0x0801C970 sets it up (r0 its work
# area; called from 0x08048C22 and 0x08128920, the only two), 0x0801D9C0 runs
# it once a frame and answers nonzero when it has closed (called from
# 0x08048C34 and 0x08128954). src/kol_menu.cpp opens the recomp's own options
# menu in its place (it holds the same twelve options): the set-up returns at
# once, and the poll answers 0 while that menu is open, 1 when it has closed.
# KOL_GAME_OPTION=1 leaves the game's window.
[[mod_function_hook]]
addr = 0x0801C970
mode = "thumb"

[[mod_function_hook]]
addr = 0x0801D9C0
mode = "thumb"

# 0x0801670C polls a text box: it returns 0xFF once the text is out and A is
# pressed. The move choice's NAVI prompt ("Choose where you want to move this
# character.", NAVI bank 0x0875D99A entry 0x22, opened at 0x080662C4) waits on
# it in state 9 (handler at 0x080662F0), then closes the box, puts the map
# cursor back (0x03000FD5 = 1) and goes on to state 0x0B. src/kol_actions.cpp
# answers 0xFF for that one caller (return address 0x080662F4), so the prompt
# closes at once and the second screen shows its text instead. Declines every
# other call: every other dialogue waits as the game made it.
# The move choice's message state (0x08066B28, return address 0x08066B2C)
# polls it too: A on a cell out of range puts up "Can't move to that spot."
# That caller is answered as well, and the text goes to the second screen.
# KOL_NO_SKIP_MOVE_NAVI=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x0801670C
mode = "thumb"

# The magic shop's second screen buys a spell and equips it by the game's own
# purchase (src/kol_shop_buy.cpp, README "Tap a character to buy and equip"):
# 0x08132444 is the Buy list's task, one frame of its state (block +0x49C):
# from the list to the "Buy?" state with no box, and on to the list after it.
# 0x080197C0 is the box's "was it cancelled", answered no for that one caller
