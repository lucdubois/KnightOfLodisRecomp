# runs 0x0804096C alone: the menu is never seen. Declines otherwise.
[[mod_function_hook]]
addr = 0x080414C0
mode = "thumb"

# 0x0807EC78 is battle preparation's task (state byte [0x0202B2A8]+0x2052).
# State 0 slides the unit list in; when it has, it opens the NAVI box "To form
# an Attack Team, dispatch up to 5 characters." unless +0x2053, the game's
# own "shown already" flag, is set or the Navigation option is off, and then
# goes straight to state 2. On that last slide frame the hook sets the flag,
# so the box is never opened, and the second screen shows the text instead
# (src/kol_actions.cpp). The one-time tutorial box before it is left alone.
# KOL_NO_SKIP_MOVE_NAVI=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x0807EC78
mode = "thumb"

# 0x08015D50(box, ?, bank, index) fetches a text box's text. src/kol_actions.cpp
# records the bank and index, to know which message a skipped box held, and
# declines every call but one: battle preparation's warnings ("No more
# characters can be dispatched.", fetched from 0x0807F1FC), which it skips,
# so the box is never made (see 0x08019088 below).
# KOL_NO_SKIP_MOVE_NAVI=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x08015D50
mode = "thumb"

# 0x08019088(a, b) sets the text system up to show a box. Battle
# preparation's warning path calls it from 0x0807F204, after the fetch
# above; src/kol_actions.cpp skips that one call when it skipped the fetch.
# The text-box poll hook (0x0801670C) then answers the warning's two polls,
# so the task goes back to its preparation screen the next frame, and the
# second screen shows the warning instead. Declines every other call.
# KOL_NO_SKIP_MOVE_NAVI=1 (or KOL_NO_ACTIONS=1).
[[mod_function_hook]]
addr = 0x08019088
mode = "thumb"

# 0x080676EC(ctx) flips bit 0x40 of the unit record's +0x17 every frame in
# battle preparation, which is the blink of the unit on a deployment square
# (the map's draw list takes an object only while the bit is set).
# src/kol_ghost.cpp clears the bit first so the flip always sets it, gives the
# object the game's own semi-transparent flag (+0x78 |= 0x100), and, while the
# game blends nothing, sets the BLDCNT/BLDALPHA copies at 0x03000E1A/E1C to
# half and half. Declines every call. KOL_NO_GHOST=1.
[[mod_function_hook]]
addr = 0x080676EC
mode = "thumb"

# 0x0805A77C builds the map's unit draw list, once a frame. src/kol_ghost.cpp
# puts back what it changed above once the flip has stopped running.
# Declines every call. KOL_NO_GHOST=1.
[[mod_function_hook]]
addr = 0x0805A77C
mode = "thumb"

# 0x08124B94(?, state*, mover) moves a scene actor along its path (the base
# at mover +0x0A/+0x0C/+0x0E plus each axis's curve). src/kol_gulls.cpp
# moves the base of the harbour gulls' movers (map 97's boat scene) back
# along their path once, so that they start off the wide view. Declines
# every call. KOL_NO_GULL_SHIFT=1.
[[mod_function_hook]]
addr = 0x08124B94
mode = "thumb"

# 0x0811A248(ctx) steps a story scene script thread (ctx +0x00 s16 offset,
# +0x10 the script; op table 0x0816501C, 8 bytes: s8 length, handler; ops
# run until one waits). src/kol_gulls.cpp has map 97's boat scene's main
# thread create the two people on the quay (06 05 ..., 06 75 ...) before it
# spawns the gulls' threads and joins them, instead of after: they stand in
# the wide view's right margin and appeared there once the gulls had gone.
# Rewrites that thread's offset only; declines every call. KOL_NO_QUAY_EARLY=1.
[[mod_function_hook]]
addr = 0x0811A248
mode = "thumb"

# 0x080598DC(node, object) emits a map unit's shadow blob (descriptor
# 0x0860EFBC: tiles 0x14B/0x14C), called from the sprite flush 0x0807690C for
# the node the draw list 0x0805A77C registered. src/kol_gulls.cpp returns at
# once for the street soldier of map 97's boat scene while he fades out (his
# boots over a solid blob did not fade: our PPU does not blend a sprite over
# another sprite); declines every other call. KOL_NO_LONG_WALK=1.
[[mod_function_hook]]
addr = 0x080598DC
mode = "thumb"

# 0x03005DE0(sx, sy, X, Y, [sp] Z, ..., [sp+0xC] out) works out the OBJ
# priority of a map unit's four sprite quarters against the terrain in front
# of it (IWRAM, the copy of ROM 0x087D58F8; called through the pointer at
# 0x0860FC5C from the unit's slot routine, 0x0805A350, which stores the four
# bytes at object +0x8C). Its X, Y, Z are the object's +0x16 (the place its
# move started from). West of column 0 it takes the ground as height -255,
# so the town's archers walking in off the grid (src/kol_gulls.cpp) had their
# lower half put behind the edge column's terrain (priority 3) for their
# last 22 px off the grid: half a body in the wide view. src/kol_gulls.cpp
# makes that call again with X (or Z) put on the grid's edge, for those
# actors only, and declines every other call. KOL_NO_ARCHER_WALK_IN=1.
[[mod_function_hook]]
addr = 0x03005DE0
mode = "thumb"

# 0x0815C4E8 is MP2K's m4aSongNumStart(song), which the game's sound routine
# calls for music and effects alike (the song table at 0x08167BB8).
# src/kol_rumble.cpp starts a rumble for the effects it lists (205: the
# thunder) and declines every call. Options > Rumble Off: nothing plays.
[[mod_function_hook]]
addr = 0x0815C4E8
mode = "thumb"

# The left stick moves the battle map's hand cursor (src/kol_stick_cursor.cpp,
# Options > Analog Cursor). 0x08056E90 is the cursor's task (cursor 0x03000FA0),
# once a frame; with the cursor out (+0x35 = 1) and no direction held, the hook
# moves a point by the stick and, when it crosses into another cell the step
# 0x08056F90 would enter (flag 0x20), writes the cell as the step does (+0x44/
# +0x48 the old u32s, +0x3C/+0x40 the new x, z). Declines every call.
[[mod_function_hook]]
addr = 0x08056E90
mode = "thumb"

# 0x08002394(def, x, y, ...) draws a sprite at a screen place; cursor_draw
# 0x08057768 calls it for the floating hand (return 0x08057874). While the
# point is off its cell's middle, src/kol_stick_cursor.cpp makes that one call
# again with x, y moved by the point's offset (R15 = 0x08002394, LR kept) and
# lets the repeated call run. Declines every other call.
[[mod_function_hook]]
addr = 0x08002394
mode = "thumb"

# 0x0807696C(routine, owner, X, Y, [sp] Z, [sp+4] key) emits a sprite slot at a
# world point; cursor_draw calls it for the corner pieces (routine 0x08057AD5,
# return 0x08057900). As above, that one call is made again with the point's
# X, Y, Z, so the game projects and sorts it. Declines every other call.
[[mod_function_hook]]
addr = 0x0807696C
mode = "thumb"

# 0x0801FBAC answers whether the enemy side is out (battle slots 8-15 empty,
# fallen or gone). Only the five battle-outcome routines call it (0x08020230,
# 0x08020AB4, 0x0801FEA8, 0x0801FF74, 0x08020004, picked by story variable
# 0xB4 in 0x08020E30). src/kol_auto_win.cpp answers 1 once Debug > Instant
# Win has sent the battle task to its outcome check (below) and declines
# every other call. KOL_NO_AUTO_WIN=1.
# 0x0815B838 is MP2K's SoundMain, run once every frame in every scene.
# src/kol_menu.cpp applies there the changes the second screen's options menu
# queued for the game's own options (EWRAM 0x0200132C, eight bytes; also the
# game's OPTION menu work copy at [0x02028950]+0x1194 while it is open).
# Declines every call, except Fast Attacks' extra frames (below).
# KOL_NO_MENU_OPTIONS=1.
[[mod_function_hook]]
addr = 0x0815B838
mode = "thumb"

# 0x0815BE18 is MP2K's SoundVSync, called from the VBlank handler
# (0x080005A6) once a frame: it counts the sound DMA's frames. While a strike
# plays with Options > Fast Attacks on, src/kol_fast_actions.cpp runs the
# game two frames to a presented one; over every second frame it pauses the
